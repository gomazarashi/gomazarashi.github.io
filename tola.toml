# tola.toml

[site.info]
title = "gomazarashi Lab"
author = "gomazarashi"
description = "ネットワーク・SDNを研究するgomazarashiの個人サイトです。Webアプリや小さな開発ツール、Typst・TeXに関する記事や成果物を公開しています。"
language = "ja"
url = "https://gomazarashi.com"

[site.info.extra]
# Used for og:locale. Keep separate from the HTML lang attribute (`ja`).
og_locale = "ja_JP"
# Public GitHub profile, used for structured data (Person.sameAs).
github = "https://github.com/gomazarashi"

[site.header]
styles = ["assets/styles/site.css"]

[site]
not_found = "content/404.typ"

[site.seo]
auto_og = false

[site.seo.sitemap]
enable = true
path = "sitemap.xml"

[build]
content = "content"
output = "docs"
deps = ["templates", "utils"]

[build.assets]
nested = ["assets/styles", "assets/images"]
flatten = ["assets/robots.txt"]
