# tola.toml

[site.info]
title = "gomazarashi Lab"
author = "gomazarashi"
description = "Typst・Pythonを中心に、技術記事や個人開発ツールを公開している個人サイトです。"
language = "ja"
url = "https://gomazarashi.com"

[site.header]
styles = ["assets/styles/site.css"]

[site]
not_found = "content/404.typ"

[site.seo]
auto_og = false

[site.seo.sitemap]
enable = true
path = "sitemap.xml"

[build]
content = "content"
output = "docs"
deps = ["templates", "utils"]

[build.assets]
nested = ["assets/styles"]
flatten = ["assets/robots.txt"]
